<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>San Verano: Neon Coast</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a18; overflow: hidden; height: 100%; font-family: sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #minimap { position: fixed; right: 14px; bottom: 14px; width: 210px; height: 164px; border: 2px solid rgba(255,255,255,0.5); border-radius: 8px; background: #222; }
  #hint { position: fixed; left: 14px; bottom: 14px; color: rgba(255,255,255,0.75); font-size: 12px; background: rgba(0,0,0,0.45); padding: 5px 9px; border-radius: 6px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="minimap" width="210" height="164"></canvas>
<div id="hint">E car · F punch · click shoot · Shift sprint · Space handbrake · T taxi · Esc pause</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
