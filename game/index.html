<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAN VERANO: Neon Coast</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101623; font-family: sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #minimap { position: fixed; width: 168px; height: 168px; display: block; border-radius: 6px; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="SAN VERANO Neon Coast open world game"></canvas>
<canvas id="minimap" width="168" height="168" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite">SAN VERANO: Neon Coast — open-world crime game. WASD to move, E to enter cars, mouse to aim.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
